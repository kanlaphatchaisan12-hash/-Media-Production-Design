<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ข้อสอบซ้อม CA159 Media Production Design 5 ชุด ชุดละ 20 ข้อ">
<title>CA159 · ข้อสอบซ้อม 5 ชุด</title>
<style>
:root{color-scheme:light;--navy:#10233c;--ink:#1b2130;--muted:#485668;--paper:#f6f5f0;--line:#d5dde5;--blue:#235c95;--soft:#e8f1fb}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:1.125rem/1.68 system-ui,Thonburi,"Noto Sans Thai",sans-serif}
a{color:inherit;text-underline-offset:.21em}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #0072bb;outline-offset:4px}
header.cover{background:var(--navy);color:white;border-bottom:4px solid #edbc64;padding:clamp(1.25rem,4vw,2.5rem) 1rem}
.frame{width:min(100% - 2rem,790px);margin-inline:auto}
.cover .frame{width:min(100%,790px)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,6vw,3.45rem);line-height:1.18;margin:.42rem 0 .55rem}
h2{font-size:clamp(1.45rem,3.7vw,2.05rem);line-height:1.3;margin-bottom:.5rem}
.cover p{color:#dde9f7;margin-bottom:0}
.cover a{font-size:.95rem;color:#d3e4f9}
main{padding-block:1.35rem 4rem}
.set-list{padding:0;margin:0;list-style:none;display:grid;gap:.65rem}
.set-list li{background:white;border:1px solid var(--line);border-radius:.75rem;padding:.65rem .85rem}
.set-list button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.75rem;align-items:center;background:transparent;border:0;color:var(--ink);text-align:left;width:100%;padding:.26rem .05rem;border-radius:.4rem}
.set-list button:hover .start-label,.primary:hover{background:#174573;color:#fff}
.set-no{color:var(--blue);font-weight:750;font-size:1rem}
.start-label,.primary{white-space:nowrap;background:var(--blue);color:white;padding:.38rem .7rem;border-radius:.45rem;font-size:1rem;font-weight:700}
.primary{border:0;padding:.55rem .95rem;min-height:44px}
.set-list strong{line-height:1.35}
.muted{color:var(--muted)}
.status{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--navy);color:#fff;border-radius:.55rem;padding:.5rem .8rem;margin:0 0 1rem;font-variant-numeric:tabular-nums}
.status time{font-size:1.3rem;font-weight:750}
.status time[data-low]{color:#ffd596}
.topic{margin:1.4rem 0 .65rem;scroll-margin-top:4rem}
.topic-label{display:inline-block;border-left:4px solid var(--accent);padding:.25rem .65rem;background:var(--tint);color:var(--accent);border-radius:.26rem;font-size:1.1rem;margin:0}
[data-topic="0"]{--accent:#215d99;--tint:#e8f1fb}
[data-topic="1"]{--accent:#694399;--tint:#f0e8fa}
[data-topic="2"]{--accent:#216d5b;--tint:#e2f3ed}
[data-topic="3"]{--accent:#895300;--tint:#fff1d9}
[data-topic="4"]{--accent:#983d47;--tint:#f9e9ed}
.question{min-inline-size:0;margin:0;padding:.7rem 0 1rem;border:0;border-bottom:1px solid var(--line);scroll-margin-top:4rem}
.question legend{display:contents;font-weight:750;overflow-wrap:anywhere}
.choices{display:grid;gap:.42rem;margin-top:.55rem}
.choice{border:1px solid var(--line);border-radius:.55rem;background:white;display:flex;align-items:baseline;gap:.6rem;padding:.5rem .65rem;cursor:pointer;overflow-wrap:anywhere}
.choice:focus-within{outline:2px solid var(--blue)}
.choice:has(input:checked){border-color:#3674aa;background:var(--soft)}
.choice input{flex:none;margin:0;accent-color:var(--blue);width:1em;height:1em;align-self:start;margin-top:.3em}
.choice .letter{font-weight:750;color:var(--blue)}
.choice[data-result="correct"]{background:#e3f4e8;border-color:#5e9c73}
.choice[data-result="wrong"]{background:#fff0ee;border-color:#bd7b71}
.choice:has(input:disabled){cursor:default}
.badge{font-size:.85rem;font-weight:750;display:inline-block;margin-inline-start:.4rem;color:#184d30}
[data-result="wrong"] .badge{color:#8d2c20}
.feedback{border-left:4px solid var(--blue);background:var(--soft);padding:.55rem .7rem;border-radius:.3rem;margin:.65rem 0 0}
.actions{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:1.1rem 0}
.results{background:white;border-radius:.75rem;border:1px solid var(--line);padding:1rem;margin-bottom:1.1rem}
.results dl{margin:.65rem 0 0}
.results dl div{display:flex;justify-content:space-between;gap:.65rem;border-top:1px solid var(--line);padding:.35rem 0}
.results dd{margin:0;white-space:nowrap;font-weight:750}
.results dt a{color:var(--blue)}
nav.jump{display:flex;gap:.45rem;flex-wrap:wrap;margin:.5rem 0 .75rem}
nav.jump a{background:white;border:1px solid var(--line);padding:.27rem .57rem;border-radius:.38rem;font-size:.92rem;text-decoration:none}
nav.jump a:hover{background:var(--soft)}
@media(max-width:430px){.frame{width:calc(100% - 1.35rem)}.set-list button{gap:.45rem}.set-list li{padding:.5rem .62rem}.start-label{font-size:.9rem}.status{gap:.4rem;padding:.4rem .55rem}.status small{font-size:.8rem}}
</style>
</head>
<body>
<header class="cover"><div class="frame">
<a href="index.html">กลับไปอ่านสรุป CA159</a>
<h1>ข้อสอบซ้อม CA159</h1>
<p>5 ชุด · ชุดละ 20 ข้อ · 4 ตัวเลือก · 20 นาที</p>
</div></header>
<main class="frame">
<section id="picker" aria-labelledby="picker-title">
<h2 id="picker-title" tabindex="-1">เลือกชุดข้อสอบ</h2>
<p class="muted">ทุกชุดมี 5 หมวด หมวดละ 4 ข้อ ข้อละ 1 คะแนน เริ่มจับเวลาเมื่อกดเริ่มทำ และดูเฉลยได้หลังส่งหรือหมดเวลา</p>
<ol class="set-list" id="sets"></ol>
</section>
<section id="attempt" aria-labelledby="attempt-title" hidden>
<h2 id="attempt-title" tabindex="-1"></h2>
<div class="status" id="status"><time id="timer" aria-label="เวลาที่เหลือ">20:00</time><small id="progress">ตอบแล้ว 0 / 20</small></div>
<div class="results" id="results" aria-live="polite" hidden></div>
<div class="actions" id="after-actions" hidden><button type="button" class="primary" id="back">กลับไปเลือกชุด</button></div>
<nav class="jump" id="jump" aria-label="ไปยังหมวดข้อสอบ"></nav>
<form id="form">
<div id="questions"></div>
<div class="actions" id="submit-actions"><button type="submit" class="primary">ส่งคำตอบและดูคะแนน</button><span class="muted" id="submit-count"></span></div>
</form>
</section>
<noscript>เปิด JavaScript ในเบราว์เซอร์เพื่อเริ่มทำข้อสอบและดูผลคะแนน</noscript>

:["ผ่านทีวีแล้วทุกแพลตฟอร์มปลอดเงื่อนไขเสมอ","ลงได้ถ้าเปลี่ยนชื่อตอน","สิทธิการใช้สื่อและข้อมูลบุคคลครอบคลุมช่องทางและวัตถุประสงค์ใหม่หรือไม่","ลงได้หากใช้โลโก้ใหม่เพิ่ม"],"correct":2,"explanation":"สิทธิและขอบเขตการใช้ข้อมูลอาจแยกตามช่องทางและวัตถุประสงค์"},{"prompt":"พิธีกรพูดถึงคนหนึ่งต่อสาธารณะว่าทำผิดโดยยังไม่มีข้อยืนยัน ข้อใดเป็นวิธีลดการบิดเบือนตามแนวจริยธรรม?","options":["เลือกตัดให้เหลือแต่ประโยคแรงที่สุด","ตรวจสอบข้อมูล แยกข้อเท็จจริงจากข้อกล่าวหา และให้โอกาสชี้แจง","ใส่คำว่า “เชื่อว่า” ไว้หน้าเรื่องแล้วถือว่าพอ","อ้างว่ายอดวิวสูงจึงนำเสนอได้"],"correct":1,"explanation":"ต้องชัดว่าข้อใดมีหลักฐาน ข้อใดเป็นข้อกล่าวหา และปฏิบัติต่อผู้เกี่ยวข้องอย่างเป็นธรรม"},{"prompt":"ข้อใดเป็นตัวอย่าง Digital Law ในแผนที่ 8 กลุ่มของสไลด์?","options":["พิจารณาการเผยแพร่ข้อมูลผ่านระบบหรือแพลตฟอร์มออนไลน์","วัดน้ำหนักที่เวทีรับได้","ทำใบเช่าชุดนักแสดง","กำหนดสัดส่วนสีใน Mood Board"],"correct":0,"explanation":"กรอบ Digital Law ชวนถามว่าเนื้อหาหรือข้อมูลใดเผยแพร่ทางออนไลน์ได้และมีข้อกำหนดใดเกี่ยวข้อง"},{"prompt":"เมื่อมีประโยชน์สาธารณะในการรายงานเหตุเกี่ยวกับเด็ก แต่เบาะแสในภาพทำให้รู้ตัวเด็กผู้เสียหาย ควรเลือกวิธีใด?","options":["เผยแพร่ทุกเบาะแสเพราะสาธารณะสนใจ","รายงานเฉพาะชื่อโรงเรียนและชื่อครอบครัวแทนการลงหน้า","ใช้คำเตือนก่อนคลิปแล้วปล่อยภาพเต็มเสมอ","อธิบายสารที่จำเป็นโดยหลีกเลี่ยงรายละเอียดที่ชี้ตัวเด็ก"],"correct":3,"explanation":"ประโยชน์สาธารณะกับการคุ้มครองเด็กต้องพิจารณาร่วมกัน ลดข้อมูลระบุตัวที่ไม่จำเป็นต่อสาร"}]}]</script>
<script>
const sets = JSON.parse(document.querySelector('#question-data').textContent);
const topics = [
  ['ผู้ชมและเนื้อหา', 'Content + Audience Analysis', 'content'],
  ['อารมณ์และงานภาพ', 'Mood & Tone, Mood Board + Graphics', 'visual'],
  ['ฉากและเวที', 'Set + Stage Design', 'set'],
  ['สปอนเซอร์และแบรนด์', 'Sponsor + Brand Integration', 'sponsor'],
  ['จริยธรรมและกฎหมาย', 'Ethics + Laws', 'ethics'],
];
const labels = ['ก.', 'ข.', 'ค.', 'ง.'];
const picker = document.querySelector('#picker');
const attempt = document.querySelector('#attempt');
const heading = document.querySelector('#attempt-title');
const status = document.querySelector('#status');
const timer = document.querySelector('#timer');
const progress = document.querySelector('#progress');
const submitCount = document.querySelector('#submit-count');
const results = document.querySelector('#results');
const afterActions = document.querySelector('#after-actions');
const submitActions = document.querySelector('#submit-actions');
const questions = document.querySelector('#questions');
const jump = document.querySelector('#jump');
const form = document.querySelector('#form');
let active;
let interval;

function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value) node.textContent = value;
  if (className) node.className = className;
  return node;
}

function paintProgress() {
  const answered = active.rows.filter(row => row.chosen !== -1).length;
  progress.textContent = 'ตอบแล้ว ' + answered + ' / 20';
  submitCount.textContent = answered === 20 ? 'ตอบครบแล้ว' : 'ยังไม่ตอบ ' + (20 - answered) + ' ข้อ';
}

function tick() {
  const seconds = Math.max(0, Math.ceil((active.deadline - Date.now()) / 1000));
  timer.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  timer.toggleAttribute('data-low', seconds <= 120);
  if (seconds === 0) finish(true);
}

function start(set, index) {
  clearInterval(interval);
  questions.replaceChildren();
  jump.replaceChildren();
  results.replaceChildren();
  results.hidden = afterActions.hidden = true;
  status.hidden = submitActions.hidden = false;
  heading.textContent = 'ชุดที่ ' + (index + 1) + ' · ' + set.title;
  const rows = [];
  for (const [topicIndex, [thai, english]] of topics.entries()) {
    const section = element('section', '', 'topic');
    section.id = 'topic-' + (topicIndex + 1);
    section.dataset.topic = String(topicIndex);
    const title = element('h3', thai + ' · ข้อ ' + (topicIndex * 4 + 1) + '–' + (topicIndex * 4 + 4), 'topic-label');
    section.setAttribute('aria-label', english);
    section.append(title);
    const link = element('a', thai);
    link.href = '#' + section.id;
    jump.append(link);
    for (const [offset, entry] of set.questions.slice(topicIndex * 4, topicIndex * 4 + 4).entries()) {
      const number = topicIndex * 4 + offset + 1;
      const field = element('fieldset', '', 'question');
      field.append(element('legend', number + '. ' + entry.prompt));
      const choices = element('div', '', 'choices');
      const inputs = entry.options.map((option, position) => {
        const label = element('label', '', 'choice');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'q' + number;
        input.value = String(position);
        label.append(input, element('span', labels[position], 'letter'), element('span', option));
        choices.append(label);
        return input;
      });
      field.append(choices);
      section.append(field);
      rows.push({entry, field, inputs, chosen: -1});
    }
    questions.append(section);
  }
  active = {rows, deadline: Date.now() + 20 * 60 * 1000, finished: false};
  picker.hidden = true;
  attempt.hidden = false;
  paintProgress();
  tick();
  interval = setInterval(tick, 250);
  heading.focus();
}

function finish(expired) {
  if (!active || active.finished) return;
  active.finished = true;
  clearInterval(interval);
  const topicScores = Array(5).fill(0);
  let unanswered = 0;
  for (const [index, {entry, field, inputs, chosen}] of active.rows.entries()) {
    if (chosen === -1) unanswered += 1;
    if (chosen === entry.correct) topicScores[Math.floor(index / 4)] += 1;
    for (const [position, input] of inputs.entries()) {
      input.checked = position === chosen;
      input.disabled = true;
      if (position === entry.correct) {
        input.parentElement.dataset.result = 'correct';
        input.parentElement.append(element('span', 'คำตอบที่ถูก', 'badge'));
      } else if (position === chosen) {
        input.parentElement.dataset.result = 'wrong';
        input.parentElement.append(element('span', 'คำตอบของคุณ', 'badge'));
      }
    }
    const reason = element('p', (chosen === -1 ? 'ไม่ได้ตอบ · ' : '') + 'เฉลย ' + labels[entry.correct] + ' ' + entry.explanation, 'feedback');
    field.append(reason);
  }
  const total = topicScores.reduce((sum, n) => sum + n, 0);
  const resultHeading = element('h3', (expired ? 'หมดเวลา · ' : '') + 'คะแนน ' + total + ' / 20');
  resultHeading.tabIndex = -1;
  results.append(resultHeading, element('p', 'ไม่ได้ตอบ ' + unanswered + ' ข้อ · เลื่อนลงเพื่ออ่านเฉลยและเหตุผล', 'muted'));
  const scores = element('dl');
  for (const [index, [thai,, id]] of topics.entries()) {
    const row = element('div');
    const label = element('dt');
    const link = element('a', thai);
    link.href = 'index.html#' + id;
    label.append(link);
    row.append(label, element('dd', topicScores[index] + ' / 4'));
    scores.append(row);
  }
  results.append(scores);
  status.hidden = submitActions.hidden = true;
  results.hidden = afterActions.hidden = false;
  resultHeading.focus();
}

document.querySelector('#back').addEventListener('click', () => {
  active = undefined;
  attempt.hidden = true;
  picker.hidden = false;
  document.querySelector('#picker-title').focus();
});
form.addEventListener('change', event => {
  if (!active || active.finished) return;
  if (Date.now() >= active.deadline) {
    finish(true);
    return;
  }
  const input = event.target;
  const row = active.rows[Number(input.name.slice(1)) - 1];
  row.chosen = Number(input.value);
  paintProgress();
});
form.addEventListener('submit', event => {
  event.preventDefault();
  if (active) finish(Date.now() >= active.deadline);
});
for (const [index, set] of sets.entries()) {
  const item = element('li');
  const button = element('button');
  button.type = 'button';
  button.append(element('span', 'ชุด ' + (index + 1), 'set-no'), element('strong', set.title), element('span', 'เริ่มทำ', 'start-label'));
  button.addEventListener('click', () => start(set, index));
  item.append(button);
  document.querySelector('#sets').append(item);
}
</script>
</body>
</html>
